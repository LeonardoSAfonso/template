# Configuração do SonarQube para análise do projeto

# Informações do projeto
sonar.projectKey=template
sonar.projectName=Template NestJS
sonar.projectVersion=0.0.1

# URL do servidor SonarQube (pode ser sobrescrito via variável de ambiente)
# Certifique-se de definir SONAR_HOST_URL no arquivo .env.sonar ou via export
# Quando rodando via docker-compose, use o nome do serviço: http://sonarqube:9000
sonar.host.url=http://sonarqube:9000

sonar.env.path=.env

# Token de autenticação (obrigatório para análise)
# Defina SONAR_TOKEN no arquivo .env.sonar ou via: export SONAR_TOKEN=seu_token
# O token será lido automaticamente pelo sonar-scanner via variável de ambiente

# Diretórios fonte
sonar.sources=src
sonar.tests=test

# Exclusões de análise
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/data/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.e2e-spec.ts,\
  **/test/**,\
  **/prisma/migrations/**

# Exclusões de cobertura
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.e2e-spec.ts,\
  **/test/**,\
  **/main.ts,\
  **/*.module.ts,\
  **/*.dto.ts,\
  **/*.interface.ts,\
  **/*.type.ts,\
  **/prisma/**

# Linguagem e encoding
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript configurações
sonar.typescript.tsconfigPath=tsconfig.json
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configurações de qualidade
sonar.qualitygate.wait=false

# JavaScript/TypeScript específico
sonar.javascript.lcov.reportPaths=coverage/lcov.info

