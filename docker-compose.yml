services:
  api:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      leonet:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: osiris_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: docker
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      leonet:

  keycloak:
    image: quay.io/keycloak/keycloak:19.0.1
    command:
      - start-dev
      - --import-realm
      - --http-relative-path
      - /auth
    restart: unless-stopped
    init: true
    healthcheck:
      test: curl -f http://localhost:8080/auth/realms/template || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/template-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - '8088:8080'
    networks:
      leonet:

  migrate:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - leonet

networks:
  leonet:
    driver: bridge
    name: leonet
